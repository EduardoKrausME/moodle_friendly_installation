name: Import Moodle modules documentation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/import-moodle-modules-docs.yml"

permissions:
  contents: write

jobs:
  import-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download published documentation
        shell: bash
        run: |
          set -euo pipefail

          SITE_URL="https://moodle-modules-icons.eduardokraus.chatgpt.site/"
          TMP_DIR="$(mktemp -d)"

          wget             --mirror             --convert-links             --adjust-extension             --page-requisites             --no-parent             --execute robots=off             --directory-prefix="$TMP_DIR"             "$SITE_URL"

          SITE_DIR="$TMP_DIR/moodle-modules-icons.eduardokraus.chatgpt.site"
          test -f "$SITE_DIR/index.html"

          rm -rf docs
          mkdir -p docs
          cp -a "$SITE_DIR"/. docs/

      - name: Remove Vinex and Vinext artifacts
        shell: bash
        run: |
          set -euo pipefail

          find docs -depth \( -iname '*vinex*' -o -iname '*vinext*' \) -print -exec rm -rf {} +

          python3 - <<'PY'
          from pathlib import Path
          import re

          text_extensions = {
              ".html", ".htm", ".css", ".js", ".json", ".txt",
              ".xml", ".svg", ".md", ".map", ".webmanifest"
          }

          patterns = [
              re.compile(r'<!--[^>]*(?:vinex|vinext)[\s\S]*?-->', re.I),
              re.compile(r'<script\b[^>]*(?:vinex|vinext)[^>]*>[\s\S]*?</script\s*>', re.I),
              re.compile(r'<script\b[^>]*(?:vinex|vinext)[^>]*/?>', re.I),
              re.compile(r'<link\b[^>]*(?:vinex|vinext)[^>]*>', re.I),
              re.compile(r'<meta\b[^>]*(?:vinex|vinext)[^>]*>', re.I),
          ]

          for path in Path("docs").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_extensions:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              cleaned = content
              for pattern in patterns:
                  cleaned = pattern.sub("", cleaned)

              if cleaned != content:
                  path.write_text(cleaned, encoding="utf-8")

          offenders = []
          for path in Path("docs").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_extensions:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if re.search(r'vinex|vinext', content, re.I):
                  offenders.append(str(path))

          if offenders:
              raise SystemExit("Vinex/Vinext references still present: " + ", ".join(offenders))
          PY

          touch docs/.nojekyll

      - name: Add documentation link to README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          block = """## Documentation

          [Access the documentation](docs/)

          """

          if "## Documentation" not in content:
              lines = content.splitlines(keepends=True)
              if lines and lines[0].startswith("# "):
                  insert_at = 1
                  while insert_at < len(lines) and not lines[insert_at].strip():
                      insert_at += 1
                  content = "".join(lines[:insert_at]) + "\n" + block + "".join(lines[insert_at:])
              else:
                  content = block + content

          path.write_text(content, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/import-moodle-modules-docs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs README.md .github/workflows/import-moodle-modules-docs.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "docs: add Moodle modules icon documentation"
          git push origin master
