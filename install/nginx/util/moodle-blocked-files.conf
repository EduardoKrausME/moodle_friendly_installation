# Deny direct access to Moodle source files; file-serving PHP endpoints remain accessible.
# The pattern excludes user uploads served by pluginfile.php and related endpoints.
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:admin/environment\.xml|db/install\.xml|thirdpartylibs\.xml)$ {
    return 404;
}

# Release notes, installation instructions, documentation and licensing files.
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:upgrade\.(?:txt|md)|upgrading\.(?:md|txt)|readme[^/]*|changelog[^/]*|changes[^/]*|contributing[^/]*|license[^/]*|copying[^/]*|notice[^/]*|security\.md|install(?:ation)?\.(?:md|txt|rst))$ {
    return 404;
}

# Package manifests, test configuration and sensitive PHP configuration.
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:composer\.(?:json|lock)|package(?:-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|gruntfile\.js|phpunit\.xml(?:\.dist)?|behat\.yml(?:\.dist)?|config(?:-dist)?\.php)$ {
    return 404;
}

# VCS metadata, editor configuration, environment files and accidental backups.
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:\.git|\.svn|\.hg|\.bzr|\.github|\.idea|\.vscode)(?:/|$) {
    return 404;
}
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:\.env[^/]*|\.htaccess|\.htpasswd|\.user\.ini|\.editorconfig|\.npmrc)$ {
    return 404;
}
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*[^/]+(?:\.(?:bak|backup|old|orig|save|swp|swo)|~)$ {
    return 404;
}

# Moodle CLI entry points are not HTTP endpoints.
location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*admin/cli(?:/|$) {
    return 404;
}
