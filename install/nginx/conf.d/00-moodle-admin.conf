log_format                  moodle-admin '$remote_addr [$time_local] "$request_method $status $scheme://$host$request_uri" $bytes_sent "$http_referer" "$http_user_agent" $request_time';

include /etc/nginx/sites-enabled/*.conf;

access_log                  /var/log/nginx/access.log moodle-admin;

add_header                  X-Me $hostname;

# common proxy settings
proxy_connect_timeout       1000;
proxy_send_timeout          1500;
proxy_read_timeout          2000;

# common file caching / aio
open_file_cache             max=100 inactive=5m;
open_file_cache_valid       2m;
open_file_cache_min_uses    1;
open_file_cache_errors      on;

proxy_cache_path            /etc/nginx/cache   levels=1:2   keys_zone=krauscache:10m   inactive=24h   use_temp_path=off;
proxy_cache_key             "$scheme$request_method$host$request_uri";

limit_req_zone              $binary_remote_addr zone=perip:10m rate=20r/s;

map $http_user_agent $block_bot {
    default         0;
    ~*(curl|AhrefsBot|bingbot|MixrankBot|Amazonbot|PetalBot|SemrushBot|YandexBot|DuckDuckBot|Applebot|python|UptimeRobot|Facebot|Twitterbot|DotBot|Go-http-client|OpenIndexScanner|ClaudeBot) 1;
}

server {
    # Deny direct access to Moodle source files; file-serving PHP endpoints remain accessible.
    # The pattern excludes user uploads served by pluginfile.php and related endpoints.
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:admin/environment\.xml|db/install\.xml|thirdpartylibs\.xml)$ { return 404; }

    # Release notes, installation instructions, documentation and licensing files.
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:upgrade\.(?:txt|md)|upgrading\.(?:md|txt)|readme[^/]*|changelog[^/]*|changes[^/]*|contributing[^/]*|license[^/]*|copying[^/]*|notice[^/]*|security\.md|install(?:ation)?\.(?:md|txt|rst))$ { return 404; }

    # Package manifests, test configuration and sensitive PHP configuration.
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:composer\.(?:json|lock)|package(?:-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|gruntfile\.js|phpunit\.xml(?:\.dist)?|behat\.yml(?:\.dist)?|config(?:-dist)?\.php)$ { return 404; }

    # VCS metadata, editor configuration, environment files and accidental backups.
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:\.git|\.svn|\.hg|\.bzr|\.github|\.idea|\.vscode)(?:/|$) { return 404; }
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*(?:\.env[^/]*|\.user\.ini|\.editorconfig|\.npmrc)$ { return 404; }
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*[^/]+(?:\.(?:bak|backup|old|orig|save|swp|swo)|~)$ { return 404; }

    # Moodle CLI entry points are not HTTP endpoints.
    location ~* ^/(?!(?:pluginfile|draftfile|tokenpluginfile|r)\.php/|webservice/pluginfile\.php/)(?:[^/]+/)*admin/cli(?:/|$) { return 404; }

    # Block any unauthorized requests.
    location ~* /\.git  { return 404; }
    location ~* wp-     { return 404; }
    location ~ \.env    { return 404; }
    location ~* phpinfo { return 404; }
    # Block requests from bots and automated clients identified by the $block_bot user-agent map.
    if ($block_bot)     { return 404; }
}
