<VirtualHost *:8080>
    ServerName {{DOMAIN}}

    DocumentRoot {{WEBROOT}}

    XSendFile On
    XSendFilePath {{MOODLEDATA}}

    <Directory {{MOODLE_DIR}}>
        Require all denied
    </Directory>

    <Directory {{WEBROOT}}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php
        FallbackResource /r.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:{{PHP_FPM_SOCKET}}|fcgi://localhost/"
    </FilesMatch>
</VirtualHost>