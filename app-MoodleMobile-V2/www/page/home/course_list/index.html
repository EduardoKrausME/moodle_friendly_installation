
<ons-page id="page-course-list">
    <div class="content">
        <div id="user-info"></div>

        <div class="xpull-content">
            <div class="xpull">
                <div class="xpull__start-msg">
                    <div class="xpull__arrow"></div>
                </div>
                <div class="xpull__spinner">
                    <div class="xpull__spinner-circle"></div>
                </div>
            </div>

            <main class="home-dashboard">
                <section id="home-continue" aria-live="polite"></section>

                <section class="home-courses">
                    <div class="home-section-heading">
                        <h2 data-i18n="home.mycourses"></h2>
                        <span id="home-course-count" class="home-course-count"></span>
                    </div>

                    <div id="page-course-list-content" class="home-course-list">
                        <ons-icon icon="md-spinner" spin></ons-icon>
                    </div>

                    <div id="home-search-empty" class="home-search-empty" hidden>
                        <ons-icon icon="ion-ios-search"></ons-icon>
                        <p data-i18n="home.search.empty"></p>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        $('#page-course-list .xpull-content').xpull({
            'callback': function () {
                CourseList.loadCursos();
            }
        });
    </script>

    <link href="page/home/course_list/style.css" rel="stylesheet"/>

    <script>
        I18n.apply();
    </script>
</ons-page>
